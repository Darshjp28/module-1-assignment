# config/mosquitto.conf
# Mosquitto 2.x configuration for SmartFactory assignment

# ── Listeners ──────────────────────────────────────────────────────────────────
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ── Security ───────────────────────────────────────────────────────────────────
# Allow anonymous connections for development/testing
allow_anonymous true

# ── Persistence ────────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ────────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# ── Message limits ─────────────────────────────────────────────────────────────
max_inflight_messages 100
max_queued_messages 1000
